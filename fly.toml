# fly.toml app configuration file generated for handout-b-kd8zdw on 2026-06-15T13:26:36Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'handout-b-kd8zdw'
primary_region = 'lhr'
console_command = '/code/manage.py shell'

[build]

[deploy]
  release_command = 'python manage.py migrate --noinput'

[env]
  PORT = '8000'

[processes]
  app = 'python manage.py runserver 0.0.0.0:8000'
  celery = 'celery -A Handout worker --loglevel=INFO'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
